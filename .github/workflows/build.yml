name: Build and Release DRMTRGRR (Windows & macOS)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-13]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch JUCE for macOS SDK
        if: runner.os == 'macOS'
        run: |
          python3 -c '
          import os
          path = "libs/JUCE/modules/juce_gui_basics/native/juce_Windowing_mac.mm"
          if os.path.exists(path):
              with open(path, "r") as f:
                  content = f.read()
              content = content.replace("CGImageRef screenShot = CGWindowListCreateImage", "CGImageRef screenShot = nullptr; // CGWindowListCreateImage")
              with open(path, "w") as f:
                  f.write(content)
          '

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/DRMTRGRR_artefacts/Release/VST3/DRMTRGRR.vst3, build/DRMTRGRR_artefacts/Release/Standalone/DRMTRGRR.exe -DestinationPath DRMTRGRR-Windows-x64.zip

      - name: Upload Windows Zip Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DRMTRGRR-Windows-x64
          path: DRMTRGRR-Windows-x64.zip

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config Release --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/DRMTRGRR_artefacts/Release
          zip -r ../../../DRMTRGRR-macOS.zip VST3/DRMTRGRR.vst3 AU/DRMTRGRR.component Standalone/DRMTRGRR.app
          cd ../../..

      - name: Upload macOS Zip Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DRMTRGRR-macOS
          path: DRMTRGRR-macOS.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DRMTRGRR-Windows-x64
          path: release-files

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: DRMTRGRR-macOS
          path: release-files

      - name: Display Release Files
        run: ls -la release-files/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'DRMTRGRR v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DRMTRGRR by yeahwaah
            **Slate Digital Trigger 2 inspired drum transient replacer & enhancer (VST3 / AU / Standalone)**

            ![DRMTRGRR GUI Preview](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name || 'main' }}/assets/screenshot.png)

            ### Downloads:
            - **Windows**: `DRMTRGRR-Windows-x64.zip` (Includes `DRMTRGRR.vst3` & `DRMTRGRR.exe` Standalone)
            - **macOS**: `DRMTRGRR-macOS.zip` (Includes `DRMTRGRR.vst3`, `DRMTRGRR.component` AU, & `DRMTRGRR.app` Standalone)
            - **Screenshot**: `screenshot.png` (High-resolution 2x Retina GUI preview)

            ### Features:
            - **Real-Time Transient Oscilloscope**: CRT reticle grid with dB markings, luminous neon waveform, and transient hit beacons with shockwave ripples
            - **Interactive DETAIL / THRESHOLD Laser**: Draggable amber threshold line with direct mouse dragging and dB readout
            - **Bandpass Transient Filter Overlay**: Visual Low-Cut and High-Cut boundary lines with shaded frequency attenuation zones and draggable handles directly on the display
            - **Filter Audition**: Amber **AUDITION** mode for isolating sidechain drum frequencies
            - **ReTrigger Lockout**: Visual lockout duration bar (5–500ms) to eliminate ringing and double-triggering
            - **Transient-Driven Gate**: Dedicated gate module with Threshold, Attack, Hold, and Release
            - **Bleed Cancellation & Crosstalk Suppression**: Differential energy leakage suppression
            - **6 Color-Coded Instrument Channels**: Modular channel strips with custom slot theme colors, waveform thumbnail with hit flash playhead, and tactile action buttons ([LOAD], [FACTORY], [HIT])
            - **Console Mixing Strip**: Long-throw console volume faders, calibrated dB scale (+12 to -inf), 12-segment studio LED peak meters with peak hold, Pan, Tune (±24 st), and illuminated Solo (S), Mute (M), Phase (ø) buttons
            - **Velocity Range Bar**: Dual-range velocity split bar (1–127) with hit velocity indicators
            - **Multi-Channel File Browser**: High-res sample preview, format metadata plaque, audition player, and direct 1-click loading into Channels 1–6
            - **Global Settings & Velocity Curves**: Linear, Logarithmic, Exponential, and S-Curve dynamics response
            - **Full MIDI Output & Input**: Configurable note and channel routing
          files: |
            release-files/*.zip
            assets/screenshot.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
