name: Build DRMTRGRR (Windows & macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release --parallel

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --config Release --parallel

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DRMTRGRR-Windows-VST3-and-Standalone
          path: |
            build/DRMTRGRR_artefacts/Release/VST3/DRMTRGRR.vst3
            build/DRMTRGRR_artefacts/Release/Standalone/DRMTRGRR.exe

      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DRMTRGRR-macOS-Universal-VST3-AU-App
          path: |
            build/DRMTRGRR_artefacts/Release/VST3/DRMTRGRR.vst3
            build/DRMTRGRR_artefacts/Release/AU/DRMTRGRR.component
            build/DRMTRGRR_artefacts/Release/Standalone/DRMTRGRR.app
