name: Build and Release DRM-TRGRR (Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on Windows 2022
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows Plugins
        shell: pwsh
        run: |
          Compress-Archive -Path "build/DRMTRGRR_artefacts/Release/VST3/DRM-TRGRR1.1.0.vst3", "build/DRMTRGRR_artefacts/Release/Standalone/DRM-TRGRR1.1.0.exe" -DestinationPath DRM-TRGRR.1.1.0-Win64.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRM-TRGRR.1.1.0-Win64
          path: DRM-TRGRR.1.1.0-Win64.zip

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DRM-TRGRR.1.1.0-Win64
          path: release-files

      - name: Display Release Files
        run: ls -la release-files/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'DRM-TRGRR v1.1.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DRM-TRGRR by yeahwaah audio
            **SSL console inspired drum transient replacer & enhancer (VST3 / Standalone)**

            ### Windows Download
            - `DRM-TRGRR.1.1.0-Win64.zip` includes the VST3 plugin and standalone app.

            ### Interface Preview
            ![DRM-TRGRR SSL console interface](https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/screenshot.png)

            ### Features
            - Real-time oscilloscope with draggable **DETAIL** threshold bar
            - Bandpass transient filter with **LISTEN** audition
            - Retrigger control, dynamics, leakage suppression, and transient gate
            - Six sample slots with large channel faders, pan and tune knobs, meters, and envelopes
            - Factory drum sounds, drag-and-drop sample loading, and MIDI input/output
          files: release-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
