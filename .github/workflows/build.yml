name: Build and Release DRMTRGRR (Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 (VST3 & Standalone)
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Windows)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Windows)
        run: |
          cmake --build build --config Release --parallel

      - name: Package Windows Release (VST3 & Standalone)
        shell: pwsh
        run: |
          Compress-Archive -Path build/DRMTRGRR_artefacts/Release/VST3/DRMTRGRR.vst3, build/DRMTRGRR_artefacts/Release/Standalone/DRMTRGRR.exe -DestinationPath DRMTRGRR-Windows-x64.zip

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRMTRGRR-Windows-x64
          path: DRMTRGRR-Windows-x64.zip

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: DRMTRGRR-Windows-x64
          path: release-files

      - name: Display Release Files
        run: ls -la release-files/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'DRMTRGRR v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## DRMTRGRR by yeahwaah
            **Slate Digital Trigger 2 inspired drum transient replacer & enhancer (VST3 & Standalone)**

            ### Downloads:
            - **Windows**: `DRMTRGRR-Windows-x64.zip` (Includes `DRMTRGRR.vst3` & `DRMTRGRR.exe` Standalone)

            ### Features:
            - Real-time oscilloscope visualizer with draggable **DETAIL** threshold bar and dynamic transient shockwaves
            - Bandpass transient filter (Low-Cut / High-Cut) with amber **LISTEN** audition button
            - ReTrigger lockout (5–500ms), Dynamics sensitivity curve, and Leakage crosstalk suppression
            - Transient-driven gate on the original dry drum track
            - 6-slot instrument rack with volume faders, 10-segment studio LED ladder meters, pan, tune (±24 st), solo, mute, phase invert, and envelopes
            - Built-in factory synthesized drum sounds (Kick, Snare, Rim, Sub, Room, Crisp) + drag-and-drop sample support directly onto slots or visualizer
            - Full MIDI Output & Input
          files: release-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
